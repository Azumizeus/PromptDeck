name: Test Plugin Installation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-routers:
    name: Auto-regenerate OpenHands routers on skill description changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Regenerate OpenHands routers from skill descriptions
        run: node scripts/generate-openhands-routers.js

      - name: Detect router drift
        id: drift
        run: |
          if git diff --quiet -- .openhands/microagents/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Routers already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- .openhands/microagents/
          fi

      - name: Validate regenerated routers
        if: steps.drift.outputs.changed == 'true'
        run: |
          node scripts/validate-openhands-microagent.js
          node scripts/openhands-loader-sim.js

      - name: Auto-commit regenerated routers
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openhands/microagents/
          git commit -m "chore(openhands): regenerate routers from updated skill descriptions" \
            --trailer "Generated-with=OpenHands-router-generator"
          git push

  validate-skills:
    name: Validate skill content
    needs: [regenerate-routers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      - name: Test skill lint rules
        run: node --test scripts/lib/skill-lint-test.js

      - name: Validate manifest versions
        run: node scripts/validate-versions.js

      - name: Test manifest version validator
        run: node --test scripts/validate-versions-test.js

      - name: Test skill eval runner
        run: node --test scripts/run-evals-test.js

      - name: Run skill evals (trigger + routing)
        run: node scripts/run-evals.js --min-rank1 95

      - name: Validate references/ links in skills
        run: node scripts/validate-reference-links.js

      - name: Test reference-link validator
        run: node --test scripts/validate-reference-links-test.js

      - name: Test session-start hook payload
        run: bash hooks/session-start-test.sh

      - name: Validate OpenHands microagents
        run: node scripts/validate-openhands-microagent.js

      - name: Test OpenHands microagent validator
        run: node --test scripts/validate-openhands-microagent-test.js

      - name: Simulate OpenHands conversation start
        run: node scripts/openhands-loader-sim.js

      - name: Test OpenHands loader simulator
        run: node --test scripts/openhands-loader-sim-test.js

      - name: Check generated OpenHands routers are in sync
        run: node scripts/generate-openhands-routers.js --check

      - name: Test OpenHands router generator
        run: node --test scripts/generate-openhands-routers-test.js

  validate-commands:
    name: Validate command parity and description sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate commands across all tool directories
        run: node scripts/validate-commands.js

      - name: Test command validator
        run: node --test scripts/validate-commands-test.js

      - name: Validate spec/plan/todo artifact paths
        run: node scripts/validate-artifact-paths.js

      - name: Test artifact-path validator
        run: node --test scripts/validate-artifact-paths-test.js

  validate:
    name: Validate plugin structure
    needs: [validate-skills, validate-commands]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install agent-skills@addy-agent-skills --scope user
