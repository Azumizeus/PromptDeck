<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Banc d'essai — MEGA PACK Panel (userscript)</title>
<style>
  body { margin:0; font:14px/1.5 -apple-system,sans-serif; background:#0d1117; color:#e6edf3; display:flex; height:100vh; }
  #chat { flex:1; display:flex; flex-direction:column; padding:20px; gap:14px; }
  #log { flex:1; overflow-y:auto; background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; }
  #log p { margin:0 0 10px; color:#8b949e; }
  #log p b { color:#e6edf3; }
  #ed { min-height:70px; max-height:160px; overflow-y:auto; background:#161b22; border:1px solid #30363d; border-radius:12px; padding:12px; outline:none; }
  #ed:focus { border-color:#7c6cff; }
  #ed:empty::before { content:'Message Claude…'; color:#6e7681; }
  #send { align-self:flex-end; background:#238636; color:#fff; border:none; border-radius:8px; padding:8px 18px; cursor:pointer; font-weight:600; }
  #note { padding:14px 18px; background:#161b22; border-left:1px solid #30363d; font-size:12.5px; color:#8b949e; max-width:280px; }
</style>
</head>
<body>
<div id="chat">
  <div id="log"><p><b>Claude :</b> Bonjour ! Banc d'essai du panneau MEGA PACK — le panneau ⚡ doit être en bas à droite.</p></div>
  <div id="ed" contenteditable="true"></div>
  <button id="send">Envoyer</button>
</div>
<div id="note">
  Banc d'essai : cette page simule une conversation LLM avec un éditeur contenteditable,
  comme Claude/ChatGPT. Le userscript <code>mega-pack-panel-full.user.js</code> est chargé
  ci-dessous comme le ferait Tampermonkey.
</div>
<script>
// Tampermonkey exécute le userscript dans la page : on reproduit ça.
// (le FULL embarque le catalogue — c'est le fichier réellement installé)
const s = document.createElement('script');
s.src = "mega-pack-panel-full.user.js"; // userscript vivant — plus jamais de copie inline périmée
document.body.appendChild(s);
</script>
</body>
</html>
